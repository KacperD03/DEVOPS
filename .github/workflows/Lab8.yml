name: lab_8_416404


on:
  push:
    branches:
      - Lab8/416404
    
jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install libs for testing
        run: |
          pip install pytest 

      - name: prepare environemnt 
        run: |
           cd ./Lab_8/env_416404 && python -m pip install -r requirements.txt

      - name: Run test
        run: |
          cd ./Lab_8/env_416404/main && pytest calculator_test.py

  function_test:
    runs-on: ubuntu-latest
    needs: unit_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install libs for testing
        run: |
          pip install pytest 

      - name: prepare environemnt 
        run: |
           cd ./Lab_8/env_416404 && python -m pip install -r requirements.txt

      - name: Run app
        run: |
          cd ./Lab_8/env_416404/main && nohup python app.py &

      - name: Wait for app to start
        run: |
          sleep 10

      - name: Run test
        run: |
          cd ./Lab_8/env_416404/main && pytest app_test.py
  
  deployment:
    runs-on: ubuntu-latest
    needs: function_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./Lab_8/env_416404
          file: ./Lab_8/env_416404/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/kacperd03:latest
      
      - name: Verify deployment
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/kacperd03:latest
          docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/kacperd03:latest python -c "import app; print('Deployment successful')"