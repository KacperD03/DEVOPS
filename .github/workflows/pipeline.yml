name: lab_7_416404_test

on:
  push:
    branches:
      - Lab7/416404
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install libs for testing
      run: |
        pip  install pytest 
    
    - name: prepare environemnt 
      run: |
         cd ./Lab_7/env_416404 && python -m pip install -r requirements.txt
      

  test_dodawanie:
runs-on: ubuntu-latest

steps:
- name: Checkout code
  uses: actions/checkout@v2

- name: Set up Python
  uses: actions/setup-python@v2
  with:
    python-version: '3.11'

- name: Install libs for testing
  run: |
    pip  install pytest 

- name: prepare environemnt 
  run: |
     cd ./Lab_7/env_416404 && python -m pip install -r requirements.txt
  

- name: Run test
  run: |
    cd ./Lab_7/env_416404 && pytest calculator_test.py::test_dodawanie

